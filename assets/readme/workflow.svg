<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">PackPorter 个人资产迁移流程</title>
  <desc id="desc">流程示意：选择旧版和新版实例，预览各级资产的迁移计划，再确认执行迁移。</desc>
  <rect width="1200" height="300" rx="20" fill="#f0f5ef"/>
  <g fill="none" stroke="#15803d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <g id="instance-folders" transform="translate(64 48)">
      <path d="M0 16V0H35L48 16H98V76H0Z" fill="#dae9d6"/>
      <path d="M39 46V30H74L87 46H137V106H39Z" fill="#f0f5ef"/>
      <path d="M79 76H109M99 66L109 76L99 86"/>
    </g>
    <g id="migration-plan" transform="translate(456 48)">
      <rect width="104" height="106" rx="8"/>
      <path d="M20 28L26 34L38 20M52 27H82M20 55L26 61L38 47M52 54H82M20 82L26 88L38 74M52 81H82"/>
    </g>
    <g id="asset-parcel" transform="translate(844 48)">
      <path d="M0 27L53 0L106 27V81L53 108L0 81Z" fill="#dae9d6"/>
      <path d="M0 27L53 54L106 27M53 54V108M27 14L80 41"/>
      <path d="M25 76L39 84"/>
    </g>
    <g id="flow-arrows" stroke="#71846e">
      <path d="M309 102H363M351 90L363 102L351 114M699 102H753M741 90L753 102L741 114"/>
    </g>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="42" font-weight="700" fill="#1f3427">
    <text x="64" y="225">选择实例</text>
    <text x="456" y="225">预览计划</text>
    <text x="844" y="225">确认迁移</text>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#53654f">
    <text x="64" y="264">01</text>
    <text x="456" y="264">02</text>
    <text x="844" y="264">03</text>
  </g>
</svg>
