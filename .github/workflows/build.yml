name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # tag 发布不可被后续运行取消，避免留下缺少附件的 Release。
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.93.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Validate version
        id: version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'packporter').version
          if (!$version) { throw 'Cargo package version is missing' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        # ui_wiring 需要真实事件循环；软件渲染避免依赖托管 runner 的 GPU。
        env:
          SLINT_BACKEND: winit-software
        run: cargo test --locked

      - name: Build release executable
        # 静态链接 MSVC 运行库，使分发包无需另行安装 VC++ Redistributable。
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin packporter

      - name: Package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $packageName = "packporter-v$env:PACKAGE_VERSION-windows-x86_64"
          $packageDir = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/packporter.exe, LICENSE -Destination $packageDir
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archive = "dist/$packageName.zip"
          Compress-Archive -Path "$packageDir/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageName.zip" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--verify-tag --title "PackPorter $RELEASE_TAG")
          # SemVer 的预发布后缀决定 GitHub 标记，alpha/beta/rc 不成为正式最新版。
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          notes="docs/releases/$RELEASE_TAG.md"
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          # 重跑已发布的 tag 时只补齐附件，不删除或重新创建既有 Release。
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* "${args[@]}"
          fi
