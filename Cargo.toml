[package]
name = "packporter"
version = "0.1.0-alpha.1"
edition = "2021"
default-run = "packporter"
description = "Minecraft 整合包平滑迁移工具：将旧版本实例的个人资产安全迁移到新版本实例"

[workspace]
members = ["crates/launcher"]
# 根目录构建与测试同时覆盖 GUI 和 shim，发布目录始终包含两个入口。
default-members = [".", "crates/launcher"]
resolver = "2"

[dependencies]
packporter-launcher = { path = "crates/launcher" }
# UI 框架：声明式 UI，编译期生成 Rust 绑定；raw-window-handle-06 暴露原生窗口句柄，
# 供无边框窗口的命中测试子类化取 HWND。
slint = { version = "1", features = ["raw-window-handle-06"] }
# 与 slint 的 raw-window-handle-06 feature 配套，用于匹配 RawWindowHandle::Win32。
raw-window-handle = "0.6"
# 序列化：版本 profile 解析、事务日志、应用配置持久化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# 轻量 Zip 镜像备份（仅 deflate，减少编译体积）
zip = { version = "2", default-features = false, features = ["deflate"] }
# 目录监控（模块 D：versions/ 目录感知）
notify = "8"
# 进程枚举（模块 A：javaw.exe 占用检测）
sysinfo = "0.33"
# 错误类型派生
thiserror = "2"
# 备份目录时间戳命名
chrono = { version = "0.4", features = ["clock"] }
# 递归目录遍历（迁移计划扫描）
walkdir = "2"
rfd = { version = "0.15", default-features = false }

# Windows 原生窗口镶边：命中测试子类化（标题栏拖动/边缘缩放/双击最大化）与 DWM 圆角投影。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"
winresource = "0.1.31"

[dev-dependencies]
i-slint-backend-testing = "=1.17.1"

# UI 回调集成测试：以独立程序运行（harness = false），
# 在主线程持有 Slint 事件循环，直接驱动真实回调并自检退出码。
[[test]]
name = "ui_wiring"
harness = false

[profile.release]
lto = true
strip = true
